name: Reproduce selector results

on:
  push:
    branches: [main, michael]
    paths:
      - reproduce.py
      - reproduction/**
      - research/deeptrace_experiments/selector_evaluation/results/**
      - .github/workflows/reproduction.yml
  pull_request:
    paths:
      - reproduce.py
      - reproduction/**
      - research/deeptrace_experiments/selector_evaluation/results/**
      - .github/workflows/reproduction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python reproduce.py
      - run: python -m unittest discover -s reproduction -p "test_*.py" -v
